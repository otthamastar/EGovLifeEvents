<!DOCTYPE html>
<html lang="tw">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人生事件政府挺你(demo)</title>
  <link rel="stylesheet" type="text/css" href="stylesheets/global.css">
  <script src="js/javascripts.js"></script>
</head>

<body>

  <div class="phone">
    <header id="header-home" class="home-header main">
      <div class="appbar"><button class="back" onclick="history.back()">‹</button></div>
      <div class="gov-badge">我的E政府-GOV</div>
      <div class="sub-title">登入</div>
    </header>
    <div class="screen">
      <div class="pad" id="app">
        <div class="lwrap">
          <div class="lcard">
            <h2>用 Email 登入</h2>
            <p>人生大事偶爾才遇到，不用記密碼。輸入 Email，我們寄一組登入碼／登入連結給你即可。</p>
            <input class="inp" id="email" type="email" placeholder="你的 Email，例如 you@example.com" value="">
            <div class="nextbar"><button class="pbtn primary" onclick="sendCode()">寄送登入碼</button></div>
            <div id="mailbox">
    <div class="mail"><div class="mh">📩 示範模式：這封信會寄到 XXXXX@gmail.com</div>
      <input class="inp" id="codein" inputmode="numeric" maxlength="6" placeholder="輸入 6 位數登入碼">
      <div class="nextbar"><button class="pbtn primary" onclick="verifyCode()">登入</button></div>
      <button class="mutelink" onclick="magicLogin()">或點我模擬點擊信中的「登入連結」直接登入</button>
    </div></div>
          </div>
        </div>
      </div>
    </div>
    <div class="nav" id="nav"><a aria-current="false" onclick="location.href='index.html'"><span class="i"><svg
            width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 11l9-8 9 8"></path>
            <path d="M5 10v10h14V10"></path>
          </svg></span>首頁</a><a aria-current="false"  onclick="location.href='tracker-list.html'"><span class="i"><svg width="22" height="22"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <polyline points="8 12 11 15 16 9"></polyline>
          </svg></span>我的辦理清單</a><a onclick="location.href='login.html'" aria-current="true"><span class="i"><svg width="22"
            height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path>
          </svg></span>登入</a></div>
  </div>
</body>
</html>
